<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>供应商展示｜按频道甲方</title>
  <style>
    :root {
      --bg: #f6f1e8; --paper: #fffdf8; --ink: #2c2a26; --muted: #6b655c;
      --line: #e4d8c4; --accent: #3d6b5a; --warn: #9a6b1f; --warn-bg: #fff4d6;
      --chip: #e8f0ec; --side-w: 280px; --top-h: 0px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5;
      display: flex; flex-direction: column; min-height: 100%;
    }
    .topbar {
      flex: 0 0 auto;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    .topbar h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; letter-spacing: .02em; }
    .sub, .scope { color: var(--muted); font-size: 13px; }
    .scope { margin-top: 4px; }
    .scope code { background: #efe7da; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    .note {
      margin-top: 10px; padding: 10px 12px; background: var(--warn-bg);
      border-left: 4px solid var(--warn); color: #5c4a22; border-radius: 0 8px 8px 0; font-size: 13px;
    }
    .shell {
      flex: 1 1 auto; display: flex; min-height: 0;
      max-width: 1400px; width: 100%; margin: 0 auto;
    }
    .sidebar {
      flex: 0 0 var(--side-w); width: var(--side-w);
      border-right: 1px solid var(--line); background: var(--paper);
      display: flex; flex-direction: column; min-height: 0;
      position: sticky; top: 0; align-self: flex-start;
      height: calc(100vh - var(--top-h)); max-height: calc(100vh - var(--top-h));
    }
    .side-tools { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    .side-tools input[type=search] {
      width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 8px 12px; font: inherit; font-size: 13px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chips button {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px;
    }
    .chips button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .nav-scroll { flex: 1 1 auto; overflow: auto; padding: 8px 8px 16px; }
    .party-group { margin-bottom: 10px; }
    .party-label {
      font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: none;
      color: var(--muted); padding: 8px 8px 4px; display: flex; align-items: center; gap: 6px;
    }
    .party-label .count { font-weight: 650; background: #efe7da; color: var(--ink);
      border-radius: 999px; padding: 1px 7px; font-size: 11px; }
    .nav-item {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      border-radius: 10px; padding: 9px 10px; cursor: pointer; font: inherit; color: inherit;
      display: flex; flex-direction: column; gap: 2px; margin-bottom: 2px;
    }
    .nav-item:hover { background: #f3eee4; }
    .nav-item.active { background: var(--chip); border-color: #c5d9ce; box-shadow: inset 3px 0 0 var(--accent); }
    .nav-item .row1 { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .nav-item .name { font-size: 13.5px; font-weight: 650; }
    .nav-item .meta { font-size: 11.5px; color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; background: var(--chip); color: var(--accent);
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge.empty { background: #f0ebe3; color: var(--muted); font-weight: 600; }
    .badge.party { background: #efe7da; color: var(--ink); }
    .main {
      flex: 1 1 auto; min-width: 0; overflow: auto; padding: 16px 20px 40px;
    }
    .panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .panel-title { margin: 0; font-size: 20px; font-weight: 650; }
    .panel-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .empty-state {
      margin-top: 8px; padding: 28px 20px; background: var(--paper); border: 1px dashed var(--line);
      border-radius: 14px; color: var(--muted); text-align: center; font-size: 14px;
    }
    .empty-state strong { color: var(--ink); display: block; margin-bottom: 6px; font-size: 15px; }
    .cat-block { margin-bottom: 22px; }
    .cat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .cat-title { font-size: 15px; font-weight: 650; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 6px 18px rgba(60,48,30,.04);
    }
    .thumb { display: block; background: #f3eee4; aspect-ratio: 4/3; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 4px; }
    .pname { font-size: 14.5px; font-weight: 650; margin: 0; }
    .pmeta { font-size: 12px; color: var(--muted); }
    .price { font-size: 13px; font-weight: 650; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
    .flag { font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-bg); padding: 2px 7px; border-radius: 999px; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #7a746a; }
    footer {
      flex: 0 0 auto; max-width: 1400px; width: 100%; margin: 0 auto; padding: 0 20px 20px;
      color: var(--muted); font-size: 12px; line-height: 1.5;
    }
    .mobile-bar { display: none; }
    @media (max-width: 860px) {
      .shell { flex-direction: column; }
      .sidebar {
        position: relative; width: 100%; flex: 0 0 auto; height: auto; max-height: none;
        border-right: none; border-bottom: 1px solid var(--line);
      }
      .nav-scroll {
        display: flex; flex-direction: row; flex-wrap: nowrap; gap: 6px; overflow-x: auto;
        padding: 8px 12px 12px; -webkit-overflow-scrolling: touch;
      }
      .party-group { display: contents; }
      .party-label { display: none; }
      .nav-item {
        flex: 0 0 auto; width: auto; max-width: 220px; margin: 0;
        border: 1px solid var(--line); background: #fff; white-space: nowrap;
      }
      .nav-item .meta { display: none; }
      .mobile-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 8px 12px 0; font-size: 12px; color: var(--muted);
      }
      .main { padding: 14px 14px 32px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar" id="topbar">
    <h1 id="title">供应商展示｜按频道甲方</h1>
    <div class="sub" id="subtitle">加载中…</div>
    <div class="scope" id="scope"></div>
    <div class="note" id="note"></div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="厂家列表">
      <div class="mobile-bar"><span>点击厂家切换产品</span><span id="mobileHint"></span></div>
      <div class="side-tools">
        <input type="search" id="q" placeholder="搜索甲方／厂家编码／名称…" autocomplete="off" />
        <nav class="chips" id="chips" aria-label="分类筛选"></nav>
      </div>
      <div class="nav-scroll" id="nav"></div>
    </aside>
    <main class="main" id="panel" tabindex="-1"></main>
  </div>
  <footer id="footer"></footer>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const DEFAULT_SUPPLIER = 'SUP-0029';
    let DATA = null, activeCat = '全部', selectedKey = null;

    function syncTopH() {
      const h = document.getElementById('topbar').offsetHeight || 0;
      document.documentElement.style.setProperty('--top-h', h + 'px');
    }

    function allCategories(data) {
      const set = new Set();
      for (const p of data.parties) {
        for (const c of (p.category_l1 || [])) set.add(c);
        for (const s of (p.suppliers || [])) {
          for (const c of (s.category_l1 || [])) set.add(c);
          for (const pr of (s.products || [])) {
            if (pr.category_l1) set.add(pr.category_l1);
            if (pr.category_l2) set.add(pr.category_l2);
          }
        }
      }
      return ['全部', ...Array.from(set)];
    }

    function flatEntries() {
      const out = [];
      for (const p of DATA.parties) {
        const suppliers = p.suppliers || [];
        if (!suppliers.length) {
          out.push({
            key: 'party:' + p.party_id,
            kind: 'party',
            party: p,
            supplier: null,
            products: [],
            product_count: 0,
            label: p.name,
            code: p.party_code,
            meta: (p.category_l1 || []).join('／') || '频道甲方',
            city: null,
            status: p.status || '待入库'
          });
        } else {
          for (const s of suppliers) {
            out.push({
              key: 'sup:' + s.supplier_code,
              kind: 'supplier',
              party: p,
              supplier: s,
              products: s.products || [],
              product_count: (s.products || []).length,
              label: s.name,
              code: s.supplier_code,
              meta: [s.status, s.city, s.category].filter(Boolean).join(' · '),
              city: s.city,
              status: s.status || ''
            });
          }
        }
      }
      return out;
    }

    function filterProducts(list, cat) {
      if (cat === '全部') return list;
      return list.filter(pr => pr.category_l1 === cat || pr.category_l2 === cat);
    }

    function entryMatches(e, q, cat) {
      const hay = `${e.code} ${e.label} ${e.meta} ${e.party.name} ${e.party.party_code}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (cat === '全部') return true;
      if ((e.party.category_l1 || []).includes(cat)) return true;
      if (e.supplier && (e.supplier.category_l1 || []).includes(cat)) return true;
      return filterProducts(e.products, cat).length > 0;
    }

    function groupByCat(products) {
      const map = {};
      for (const p of products) {
        const key = p.category_l2 || p.category_l1 || '未分类';
        (map[key] ||= []).push(p);
      }
      return map;
    }

    function renderCard(p) {
      const code = p.product_code || '未生成（源表未显示）';
      const outer = p.outer_qty_flag ? `<div class="pmeta" style="color:var(--warn)">${esc(p.outer_qty_flag)}</div>` : '';
      const img = p.image_url
        ? `<a class="thumb" href="${esc(p.image_url)}" target="_blank" rel="noopener"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" decoding="async" /></a>`
        : `<div class="thumb"></div>`;
      return `<article class="card">${img}<div class="body">
        <h3 class="pname">${esc(p.name)}</h3>
        <div class="pmeta">长度 ${esc(p.length || '—')}</div>
        <div class="price"><span>源表单价 ${esc(p.source_unit_price)}</span><span class="flag">非现价</span></div>
        <div class="pmeta">${esc(p.pack_label || '')}</div>${outer}
        <div class="code">product_code: ${esc(code)}</div>
        <div class="pmeta">源表行 ${esc(p.source_row ?? '—')}</div>
      </div></article>`;
    }

    function findDefaultKey(entries) {
      const hit = entries.find(e => e.kind === 'supplier' && e.code === DEFAULT_SUPPLIER);
      if (hit) return hit.key;
      const withProd = entries.find(e => e.product_count > 0);
      return (withProd || entries[0] || {}).key || null;
    }

    function renderNav() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const entries = flatEntries().filter(e => entryMatches(e, q, activeCat));
      if (!entries.some(e => e.key === selectedKey)) {
        selectedKey = findDefaultKey(entries);
      }
      const nav = document.getElementById('nav');
      const byParty = new Map();
      for (const e of entries) {
        const pid = e.party.party_id;
        if (!byParty.has(pid)) byParty.set(pid, { party: e.party, items: [] });
        byParty.get(pid).items.push(e);
      }
      let html = '';
      for (const { party, items } of byParty.values()) {
        const prodSum = items.reduce((n, e) => n + filterProducts(e.products, activeCat).length, 0);
        html += `<div class="party-group">
          <div class="party-label">${esc(party.name)} <span class="count">${items.length} · ${prodSum}款</span></div>`;
        for (const e of items) {
          const n = filterProducts(e.products, activeCat).length;
          const badge = n
            ? `<span class="badge">${n} 款</span>`
            : `<span class="badge empty">${e.kind === 'party' ? (e.status || '待入库') : '待入库'}</span>`;
          const active = e.key === selectedKey ? ' active' : '';
          html += `<button type="button" class="nav-item${active}" data-key="${esc(e.key)}">
            <div class="row1"><span class="name">${esc(e.code)} · ${esc(e.label)}</span>${badge}</div>
            <div class="meta">${esc(e.meta || '')}</div>
          </button>`;
        }
        html += `</div>`;
      }
      if (!entries.length) html = `<div class="empty-state" style="margin:8px;border:none;padding:16px">无匹配厂家</div>`;
      nav.innerHTML = html;
      nav.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedKey = btn.getAttribute('data-key');
          renderNav();
          renderPanel();
          document.getElementById('panel').scrollTop = 0;
        });
      });
      const mobileHint = document.getElementById('mobileHint');
      if (mobileHint) {
        const cur = entries.find(e => e.key === selectedKey);
        mobileHint.textContent = cur ? `${cur.code} · ${filterProducts(cur.products, activeCat).length}款` : '';
      }
      return entries;
    }

    function renderPanel() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const entries = flatEntries().filter(e => entryMatches(e, q, activeCat));
      const cur = entries.find(e => e.key === selectedKey) || entries.find(e => e.key === findDefaultKey(entries));
      const panel = document.getElementById('panel');
      if (!cur) {
        panel.innerHTML = `<div class="empty-state"><strong>无匹配结果</strong>换个关键词或分类再试。</div>`;
        return;
      }
      const products = filterProducts(cur.products, activeCat);
      const partyLine = `甲方 ${esc(cur.party.name)} · ${(cur.party.category_l1 || []).map(esc).join('／')}`;
      let body = '';
      if (!products.length) {
        const tip = cur.kind === 'party'
          ? (cur.party.note || '暂无产品／待入库。对齐频道甲方帖，库内尚无供应商行或产品资产。')
          : '暂无产品／待入库。供应商已在库名录；入库流程不变，本页仅展示层。';
        body = `<div class="empty-state"><strong>暂无产品／待入库</strong>${esc(tip)}</div>`;
      } else {
        const byCat = groupByCat(products);
        for (const [c, items] of Object.entries(byCat)) {
          body += `<div class="cat-block"><div class="cat-head"><div class="cat-title">${esc(c)}</div><span class="badge">${items.length} 款</span></div><div class="grid">${items.map(renderCard).join('')}</div></div>`;
        }
      }
      panel.innerHTML = `<div class="panel-head">
        <div>
          <h2 class="panel-title">${esc(cur.code)} · ${esc(cur.label)}</h2>
          <div class="panel-meta">${partyLine}${cur.meta ? ' · ' + esc(cur.meta) : ''}</div>
        </div>
        ${products.length ? `<span class="badge">${products.length} 款</span>` : `<span class="badge empty">待入库</span>`}
      </div>${body}`;
    }

    function renderChips() {
      const nav = document.getElementById('chips');
      nav.innerHTML = '';
      for (const c of allCategories(DATA)) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = c;
        if (c === activeCat) b.classList.add('active');
        b.addEventListener('click', () => { activeCat = c; renderAll(); });
        nav.appendChild(b);
      }
    }

    function renderAll() {
      renderChips();
      renderNav();
      renderPanel();
      const entries = flatEntries();
      const withProd = entries.filter(e => e.product_count > 0).length;
      document.getElementById('subtitle').textContent =
        `左侧厂家 · 右侧产品 · ${DATA.party_count} 甲方 · 名录 ${DATA.supplier_count} 家 · 有图产品 ${DATA.product_count} 款（${withProd} 家有货）`;
      syncTopH();
    }

    async function main() {
      DATA = await (await fetch('data/catalog.json')).json();
      document.getElementById('title').textContent = DATA.title;
      document.getElementById('note').textContent = DATA.note;
      document.getElementById('scope').innerHTML = `数据范围：<code>${esc(DATA.data_scope)}</code> · 导出 ${esc(DATA.exported_at)}`;
      document.getElementById('footer').textContent =
        `CDN ${DATA.cdn_prefix} · 静态烘焙 JSON · 未改表／未开 RLS · 布局：左侧厂家 sticky · 右侧产品主栏 · 默认选中 ${DEFAULT_SUPPLIER}`;
      selectedKey = 'sup:' + DEFAULT_SUPPLIER;
      renderAll();
      document.getElementById('q').addEventListener('input', () => { renderNav(); renderPanel(); });
      window.addEventListener('resize', syncTopH);
      syncTopH();
    }
    main().catch(err => { document.getElementById('subtitle').textContent = '加载失败：' + err.message; });
  </script>
</body>
</html>
